name: Release

# Two channels, same package names, one registry:
#
#   dev  — every push to `dev` publishes a snapshot of every publishable package as
#          `<version>-dev.<run>` under the npm dist-tag `dev`. `npm i @ligaxai/sdk` (tag `latest`)
#          never resolves these; `npm i @ligaxai/sdk@dev` or an exact pin does. Environment `npm-dev`.
#   main — Changesets: on every push to main, open/refresh the "Version packages" PR; once it is
#          merged (no changesets left), publish the bumped packages under `latest`. Environment `npm`.
#
# **Who can publish.** Only the `publish-*` jobs hold `id-token: write`, the credential npm trusted
# publishing exchanges for a publish token. They install nothing and build nothing: they download
# the tarballs a build job packed and run `npm publish` on each, so no dependency's code ever runs
# with release rights. Every job gets only the permissions it needs; nothing is granted at the top.
# The `npm` and `npm-dev` environments must be restricted to `main` and `dev` (repository settings),
# and npm's trusted-publisher entry names this file and the environment.
#
# Publishing is gated on the repository variable NPM_PUBLISH_ENABLED=true; until it is set, the
# builds still run and pack everything, and nothing is published.
#
# The first publish of each package is manual (`node scripts/publish-packages.mjs release dev` from a
# maintainer's machine, with 2FA): npm attaches a trusted publisher only to a package that exists.

on:
  push:
    branches: [main, dev]

concurrency: release-${{ github.ref }}

permissions: {}

jobs:
  # ── dev snapshots ────────────────────────────────────────────────────────────────────────────
  build-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Stamp snapshot versions (not committed)
        run: node scripts/snapshot-version.mjs "dev.${GITHUB_RUN_NUMBER}"
      - run: node scripts/publish-packages.mjs pack release-tarballs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs
          path: release-tarballs/
          if-no-files-found: error
          retention-days: 7
      - name: Publishing is not switched on yet
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: |
          echo "::notice title=npm publish skipped::Set NPM_PUBLISH_ENABLED=true after the first manual publish and trusted publishing setup. Packed; nothing published."

  publish-dev:
    needs: build-dev
    if: github.ref == 'refs/heads/dev' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Trusted publishing needs npm ≥ 11.5.1 doing the publish; an exact version, not a range.
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: release-tarballs
      - run: node scripts/publish-packages.mjs publish release-tarballs dev

  # ── stable releases ──────────────────────────────────────────────────────────────────────────
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
    steps:
      # Keeps the token: changesets pushes the version branch. This job uploads no artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Opens or refreshes the "Version packages" PR while changesets are pending; publishes
      # nothing itself.
      - name: Version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-stable:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/publish-packages.mjs pack release-tarballs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarballs
          path: release-tarballs/
          if-no-files-found: error
          retention-days: 30

  publish-stable:
    needs: build-stable
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: release-tarballs
      - run: node scripts/publish-packages.mjs publish release-tarballs latest

  tag-stable:
    needs: publish-stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Keeps the token: this job pushes the release tags. It uploads no artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # zizmor: ignore[artipacked]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: release-tarballs
      # One tag per published package (`@ligaxai/sdk@0.1.0`), as `changeset tag` would write.
      - name: Tag the release
        run: |
          node -e '
            const m = require("./release-tarballs/manifest.json");
            for (const { name, version } of m) console.log(`${name}@${version}`);
          ' | while read -r tag; do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag" && git push origin "refs/tags/$tag"
            fi
          done
