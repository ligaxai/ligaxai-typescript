# Workflow actions are pinned to commit SHAs (a release job holds publish rights through OIDC, so a
# moved tag must not change what runs). Dependabot proposes the SHA bumps, and npm updates, after a
# week's cool-down so a freshly hijacked release is likely caught before it reaches us.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # v2 renames every input release.yml uses and changes how publishing is detected: a major
      # bump is a deliberate migration, never an automatic PR.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
