# Workflow actions are pinned to commit SHAs (a release job holds publish rights through OIDC, so a
# moved tag must not change what runs). Dependabot proposes the SHA bumps, and npm updates, after a
# week's cool-down so a freshly hijacked release is likely caught before it reaches us.
# Updates target `dev`, like every change: they reach `main` only through the dev → main
# release, so the two branches never diverge (a squash-merged update on `main` did that once).
# Dependabot reads this file from the default branch, so the setting applies once it is on `main`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # v2 renames every input release.yml uses and changes how publishing is detected: a major
      # bump is a deliberate migration, never an automatic PR.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    ignore:
      # The packages support Node 22+. Types from a newer Node major would let code call APIs
      # Node 22 lacks without a type error, so @types/node moves only with the supported minimum.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
