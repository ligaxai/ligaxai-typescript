name: Release

# Changesets flow: on every push to main, open/refresh the "Version Packages" PR; when that PR is
# merged (no pending changesets remain), publish the bumped packages to npm with provenance.
#
# First publish of each package is MANUAL (`pnpm publish --access public` with 2FA from a
# maintainer's machine): npm's trusted-publisher / provenance settings attach to an existing
# package, so this job cannot create one. After that, the `npm` environment below holds no token
# at all — OIDC (`id-token: write`) is the credential.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance requires a public repo + public packages; it is attested from the OIDC token.
          NPM_CONFIG_PROVENANCE: 'true'
