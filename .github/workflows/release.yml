name: Release

# Two channels, same package names, one registry:
#
#   dev  — every push to `dev` publishes a snapshot of every publishable package as
#          `<version>-dev.<run>` under the npm dist-tag `dev`. `npm i @ligaxai/sdk` (tag `latest`)
#          never resolves these; `npm i @ligaxai/sdk@dev` or an exact pin does. Environment `npm-dev`.
#   main — Changesets: on every push to main, open/refresh the "Version Packages" PR; when it is
#          merged, publish the bumped packages under `latest`. Environment `npm`.
#
# Publishing is gated on the repository variable NPM_PUBLISH_ENABLED=true; until it is set, both
# jobs build and check everything, pack the packages as a dry run, and publish nothing.
#
# First publish of each package is MANUAL (`pnpm publish --access public --tag dev` with 2FA from
# a maintainer's machine): npm's trusted-publisher / provenance settings attach to an existing
# package. After that no token is stored anywhere — OIDC (`id-token: write`) is the credential.
# Provenance requires a public repo + public packages.

on:
  push:
    branches: [main, dev]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  stable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Version PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version
          # Empty until the owner turns publishing on (repository variable NPM_PUBLISH_ENABLED=true,
          # after the first manual publish of each package — see the header). Without it the job
          # still opens the version PR and never fails on a registry that is not set up yet.
          publish: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          # Provenance is automatic under trusted publishing (public repo + public package).
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: npm-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Stamp snapshot versions (not committed)
        run: node scripts/snapshot-version.mjs "dev.${GITHUB_RUN_NUMBER}"
      - name: Publish under the `dev` dist-tag
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        # npm's trusted publishing needs the npm CLI ≥ 11.5.1 doing the publish (see the script).
        run: |
          npm install -g npm@^11.5.1
          node scripts/publish-packages.mjs dev
      - name: Publishing is not switched on yet
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: |
          echo "::notice title=npm publish skipped::Set the repository variable NPM_PUBLISH_ENABLED=true once each package has had its first manual publish and trusted publishing is configured. The build and checks above ran; nothing was published."
          pnpm -r --filter './packages/*' exec npm pack --dry-run > /dev/null
